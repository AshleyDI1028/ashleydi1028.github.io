name: Patch Our14 v28.3 teacher cloud hub

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-our14-v28.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply teacher cloud hub patch
        run: python .github/scripts/patch_our14_v283.py
      - name: Verify patch
        run: |
          grep -Fq 'v28.3 老師總網址雲端版' our14-v28/index.html
          grep -Fq 'teacherCloudList' our14-v28/index.html
          grep -Fq 'teacher_list' our14-v28/index.html
          grep -Fq 'copyTeacherUrl()' our14-v28/index.html
      - name: Commit v28.3
        run: |
          git config user.name 'our14-builder'
          git config user.email 'actions@users.noreply.github.com'
          git add our14-v28/index.html
          git commit -m 'Add teacher cloud hub and single master URL'
          git push
