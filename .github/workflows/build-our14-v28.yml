name: Patch Our14 v28.5.7 opening money fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-our14-v28.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix opening money logic
        run: python .github/scripts/patch_our14_v2857_opening_money.py

      - name: Verify v28.5.7
        run: |
          grep -Fq 'v28.5.7 開場金錢修正版' our14-v28/index.html
          grep -Fq 'isOpeningSeatEvent' our14-v28/index.html

      - name: Commit v28.5.7
        run: |
          git config user.name 'our14-builder'
          git config user.email 'actions@users.noreply.github.com'
          git add our14-v28/index.html
          git commit -m 'Fix opening seat event money deduction in v28.5.7'
          git push
