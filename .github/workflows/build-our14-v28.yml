name: Patch Our14 v28.5.8 aftermath CG complete

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-our14-v28.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wire final aftermath CG batch
        run: python .github/scripts/patch_our14_v2858_aftermath_cg3.py

      - name: Verify v28.5.8
        run: |
          grep -Fq 'v28.5.8 後果CG補齊版' our14-v28/index.html
          grep -Fq 'cg_aftermath_batch3_sprite.jpg' our14-v28/index.html
          grep -Fq 'function eventCgPanel3' our14-v28/index.html
          test -f our14-v28/assets/cg_aftermath_batch3_sprite.jpg

      - name: Commit v28.5.8
        run: |
          git config user.name 'our14-builder'
          git config user.email 'actions@users.noreply.github.com'
          git add our14-v28/index.html
          git commit -m 'Complete aftermath CG coverage in v28.5.8'
          git push
