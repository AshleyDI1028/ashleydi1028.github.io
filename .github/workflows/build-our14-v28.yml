name: Extract Our14 aftermath events

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-our14-v28.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract aftermath definitions
        run: python .github/scripts/extract_our14_aftermath.py
      - name: Commit dump
        run: |
          git config user.name 'our14-builder'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/aftermath_dump.txt
          git commit -m 'Extract aftermath event definitions for CG pass'
          git push
