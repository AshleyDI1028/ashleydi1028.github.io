name: Patch Our14 v28.1 cloud reload

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-our14-v28.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove old cloud prompt flow from UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('our14-v28/index.html')
          s=p.read_text(encoding='utf-8')

          replacements={
            '<button class="ghost" onclick="cloudLoadPrompt()">🔗 開啟雲端續玩網址</button>':'<button class="ghost" onclick="cloudReloadCurrent()">☁ 從雲端重新讀取</button>',
            '<button onclick="cloudLoadPrompt()">🔗 開啟其他雲端網址</button>':'<button onclick="cloudReloadCurrent()">☁ 從雲端重新讀取</button>'
          }
          for old,new in replacements.items():
            if old not in s:
              raise SystemExit(f'missing expected button: {old}')
            s=s.replace(old,new)

          marker='async function saveLocal(show=false){'
          fn='''async function cloudReloadCurrent(){\n  const token=currentCloudToken();\n  if(!token){\n    alert("這個網址目前沒有綁定雲端存檔。請使用網址最後有 #cloud=…… 的完整班級網址。");\n    return;\n  }\n  try{\n    await loadCloudToken(token,true);\n  }catch(e){\n    alert("雲端讀取失敗："+(e?.message||e));\n  }\n}\n\n'''
          if 'async function cloudReloadCurrent()' not in s:
            if marker not in s:
              raise SystemExit('saveLocal marker missing')
            s=s.replace(marker,fn+marker,1)

          s=s.replace('v28 網址雲端自動存檔版：','v28.1 網址雲端自動存檔版：',1)
          p.write_text(s,encoding='utf-8')
          PY

          grep -q 'cloudReloadCurrent()' our14-v28/index.html
          grep -q '☁ 從雲端重新讀取' our14-v28/index.html
          if grep -q '開啟其他雲端網址' our14-v28/index.html; then exit 1; fi

      - name: Commit v28.1
        run: |
          git config user.name 'our14-builder'
          git config user.email 'actions@users.noreply.github.com'
          git add our14-v28/index.html
          git commit -m 'Fix cloud reload UI and remove password-style flow'
          git push
