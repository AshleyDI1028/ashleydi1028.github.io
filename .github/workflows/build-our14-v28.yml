name: Patch Our14 v28.5.1 restore ability stats

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-our14-v28.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore ability status bar
        run: python .github/scripts/patch_our14_v2851_restore_stats.py

      - name: Verify v28.5.1
        run: |
          grep -Fq 'v28.5.1 劇情分歧・能力面板修正版' our14-v28/index.html
          grep -Fq 'v2851-stat-fix' our14-v28/index.html
          grep -Fq 'classList.remove("cinematicHidden")' our14-v28/index.html
          if grep -Fq 'classList.add("cinematicHidden")' our14-v28/index.html; then exit 1; fi
          grep -Fq 'teacherCloudList' our14-v28/index.html

      - name: Commit v28.5.1
        run: |
          git config user.name 'our14-builder'
          git config user.email 'actions@users.noreply.github.com'
          git add our14-v28/index.html
          git commit -m 'Restore ability stats during story and CG scenes'
          git push
