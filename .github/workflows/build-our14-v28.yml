name: Patch Our14 v28.5.6 aftermath CG batch 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-our14-v28.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wire second aftermath CG batch
        run: python .github/scripts/patch_our14_v2856_aftermath_cg2.py

      - name: Verify v28.5.6
        run: |
          grep -Fq 'v28.5.6 後果CG・第二批掛載版' our14-v28/index.html
          grep -Fq 'cg_aftermath_batch2_sprite.jpg' our14-v28/index.html
          grep -Fq 'function eventCgPanel2' our14-v28/index.html
          test -f our14-v28/assets/cg_aftermath_batch2_sprite.jpg

      - name: Commit v28.5.6
        run: |
          git config user.name 'our14-builder'
          git config user.email 'actions@users.noreply.github.com'
          git add our14-v28/index.html
          git commit -m 'Wire second batch of aftermath CGs in v28.5.6'
          git push
