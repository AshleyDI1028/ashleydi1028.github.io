name: Patch Our14 v28.5.2 larger ability stats

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-our14-v28.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enlarge ability stats for classroom projection
        run: python .github/scripts/patch_our14_v2852_big_stats.py

      - name: Verify v28.5.2
        run: |
          grep -Fq 'v28.5.2 劇情分歧・大字能力面板版' our14-v28/index.html
          grep -Fq 'v2852-big-stats' our14-v28/index.html
          grep -Fq 'font-size:17px!important' our14-v28/index.html
          grep -Fq 'teacherCloudList' our14-v28/index.html

      - name: Commit v28.5.2
        run: |
          git config user.name 'our14-builder'
          git config user.email 'actions@users.noreply.github.com'
          git add our14-v28/index.html
          git commit -m 'Enlarge ability stats for classroom projection in v28.5.2'
          git push
