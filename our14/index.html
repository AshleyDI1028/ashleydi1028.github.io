<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我們的14歲｜載入中</title><style>html,body{margin:0;background:#080b14;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;height:100%}.wrap{height:100%;display:grid;place-items:center}.box{text-align:center;max-width:760px;padding:24px}.spinner{width:42px;height:42px;margin:0 auto 16px;border:4px solid rgba(255,255,255,.18);border-top-color:#f0ca63;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{color:#b8c2d4;display:block;margin-top:8px}.err{color:#ffb4b4;font-size:14px;word-break:break-all;margin-top:12px}</style></head><body><div class="wrap"><div class="box"><div class="spinner"></div><div style="font-size:28px;font-weight:700">正在載入《我們的14歲》…</div><small id="status">準備遊戲資料</small><div id="detail" class="err"></div></div></div><script>(async()=>{const status=document.getElementById('status'),detail=document.getElementById('detail');try{const names=Array.from({length:7},(_,i)=>`p${String(i).padStart(2,'0')}.txt`);const parts=[];for(let i=0;i<names.length;i++){status.textContent=`載入遊戲資料 ${i+1}/${names.length}`;const r=await fetch(`${names[i]}?v=20260917-0935`,{cache:'no-store'});if(!r.ok)throw new Error(`讀取 ${names[i]} 失敗（HTTP ${r.status}）`);const t=await r.text();if(!t.trim())throw new Error(`${names[i]} 是空的`);parts.push(t)}status.textContent='解壓縮遊戲資料…';const b64=parts.join('').replace(/\s+/g,'');let bin;try{bin=atob(b64)}catch(e){throw new Error(`Base64 資料損壞：${e.message}`)}const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);if(typeof DecompressionStream==='undefined')throw new Error('這個瀏覽器不支援 DecompressionStream，請改用最新版 Chrome');let html;try{const ds=new DecompressionStream('gzip');const stream=new Blob([bytes]).stream().pipeThrough(ds);html=await new Response(stream).text()}catch(e){throw new Error(`解壓縮失敗：${e.message}`)}if(!html||!/<html|<!doctype/i.test(html))throw new Error('解壓縮後不是有效的遊戲頁面');document.open();document.write(html);document.close()}catch(e){status.textContent='載入失敗';detail.textContent=e&&e.message?e.message:String(e);console.error(e)}})();</script></body></html>
