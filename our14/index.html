<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我們的14歲｜載入中</title><style>html,body{margin:0;background:#080b14;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;height:100%}.wrap{height:100%;display:grid;place-items:center}.box{text-align:center}.spinner{width:42px;height:42px;margin:0 auto 16px;border:4px solid rgba(255,255,255,.18);border-top-color:#f0ca63;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{color:#b8c2d4}</style></head><body><div class="wrap"><div class="box"><div class="spinner"></div><div>正在載入《我們的14歲》…</div><small id="status">準備完整 CG 與雲端存檔</small></div></div><script>(async()=>{try{const names=Array.from({length:14},(_,i)=>`p${String(i).padStart(2,'0')}.txt`);const parts=[];for(let i=0;i<names.length;i++){document.getElementById('status').textContent=`載入遊戲資料 ${i+1}/${names.length}`;const r=await fetch(names[i],{cache:'no-store'});if(!r.ok)throw new Error(names[i]);parts.push(await r.text())}const b64=parts.join('').trim();const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const ds=new DecompressionStream('gzip');const stream=new Blob([bytes]).stream().pipeThrough(ds);const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('status').textContent='載入失敗，請重新整理頁面';console.error(e)}})();</script></body></html>
