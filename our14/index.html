<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我們的14歲｜載入中</title><style>html,body{margin:0;background:#080b14;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;height:100%}.wrap{height:100%;display:grid;place-items:center}.box{text-align:center;max-width:760px;padding:32px}.spinner{width:42px;height:42px;margin:0 auto 16px;border:4px solid rgba(255,255,255,.18);border-top-color:#f0ca63;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{display:block;color:#b8c2d4;margin-top:10px}.err{color:#ff9d9d;white-space:pre-wrap;word-break:break-word;margin-top:16px}</style></head><body><div class="wrap"><div class="box"><div class="spinner"></div><h1>正在載入《我們的14歲》…</h1><small id="status">準備遊戲資料</small><div class="err" id="err"></div></div></div><script>(async()=>{const status=document.getElementById('status'),err=document.getElementById('err');try{const base='https://raw.githubusercontent.com/AshleyDI1028/ashleydi1028.github.io/main/our14/';const names=Array.from({length:7},(_,i)=>`p${String(i).padStart(2,'0')}.txt`);const parts=[];for(let i=0;i<names.length;i++){status.textContent=`載入遊戲資料 ${i+1}/${names.length}`;let r;try{r=await fetch(base+names[i]+'?v='+Date.now(),{cache:'no-store',mode:'cors'});}catch(e){throw new Error(`讀取 ${names[i]} 失敗：${e.message}`)}if(!r.ok)throw new Error(`讀取 ${names[i]} 失敗：HTTP ${r.status}`);parts.push(await r.text())}status.textContent='正在解壓縮遊戲…';const b64=parts.join('').replace(/\s+/g,'');let bin;try{bin=atob(b64)}catch(e){throw new Error('Base64 資料損壞：'+e.message)}const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);if(!('DecompressionStream' in window))throw new Error('瀏覽器不支援解壓縮，請改用最新版 Chrome');let html;try{const ds=new DecompressionStream('gzip');const stream=new Blob([bytes]).stream().pipeThrough(ds);html=await new Response(stream).text()}catch(e){throw new Error('解壓縮失敗：'+e.message)}if(!html||html.length<1000)throw new Error('遊戲資料不完整');document.open();document.write(html);document.close()}catch(e){status.textContent='載入失敗';err.textContent=e.message;console.error(e)}})();</script></body></html>
